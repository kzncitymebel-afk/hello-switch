name: Build Switch Homebrew

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and install libnx from source
        run: |
          # Клонируем libnx прямо в корень репозитория
          git clone --depth 1 https://github.com/switchbrew/libnx.git
          cd libnx
          # Собираем (без установки)
          make -j8
          # Проверяем, что библиотека создалась
          ls -la lib/libnx.a

      - name: Build project
        run: |
          make -j8

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-switch
          path: hello_switch.nro
