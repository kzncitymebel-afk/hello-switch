name: Build Switch Homebrew

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix pacman repositories
        run: |
          # Создаём папку, если её нет
          mkdir -p /etc/pacman.d
          # Создаём правильный файл с зеркалами
          echo "Server = https://downloads.devkitpro.org/packages" > /etc/pacman.d/dkp-mirrorlist
          echo "Server = https://www.mirrorservice.org/sites/downloads.devkitpro.org/packages" >> /etc/pacman.d/dkp-mirrorlist
          # Обновляем список пакетов
          pacman -Syy

      - name: Install libnx
        run: |
          # Устанавливаем библиотеку
          dkp-pacman -S --noconfirm switch-libnx

      - name: Build project
        run: |
          make -j8

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-switch
          path: hello_switch.nro
