name: Build Switch Homebrew

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and install libnx from source
        run: |
          # Клонируем libnx
          git clone --depth 1 https://github.com/switchbrew/libnx.git
          cd libnx
          # Собираем и устанавливаем
          make -j8
          make install
          # Проверяем, что файлы установились
          ls -la /opt/devkitpro/libnx/include/switch.h || echo "switch.h not found"

      - name: Build project
        run: |
          make -j8

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-switch
          path: hello_switch.nro
